name: Collect Chrome Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/collect_releases.py']

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4
      
      - name: Collect releases
        run: python .github/scripts/collect_releases.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Chrome releases $(date -u +'%Y-%m-%d')" || true
            for i in 1 2 3; do
              git pull --rebase -X theirs --autostash origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
